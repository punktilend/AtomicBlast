version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${REPOSITORY_URI%/*}"
  build:
    commands:
      - docker build -t "$REPOSITORY_URI:$IMAGE_TAG" -f AtomicBlast-Server/Dockerfile AtomicBlast-Server
  post_build:
    commands:
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - printf '{"imageUri":"%s"}\n' "$REPOSITORY_URI:$IMAGE_TAG"

